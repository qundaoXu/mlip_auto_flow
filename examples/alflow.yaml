# alflow run --config examples/alflow.yaml
# Keys are the long options of activate_learning_full_flow.py (underscores kept).
data_path: data                       # must contain init_dataset.xyz
foundation_model: /path/to/mace-mpa-0-medium.model
subset_size: 1000
train_ratio: 0.8
val_ratio: 0.1
seed: 42

n_comm: 4                             # committee size
comm_seed: [123, 234, 345, 456]
comm_epoch: 100
device: cuda

init_conf_path: data/small_cell_traj.xyz
md_temp: 300
md_steps: 5000
md_write_interval: 10

uncert_threshold: 0.9                 # on min-max normalised sigma, see README
uncert_max_frames: 100

n_rounds: 3
keep_all_rounds: true

dft_root: dft_cal
dft_template_dir: dft_input           # INCAR, POTCAR, std.run
dft_template_files: [INCAR, POTCAR, std.run]
submitjobs: submitjobs.sh
outcar2xyz: outcar2xyz.sh
dft_poll_sec: 300
dft_timeout_hr: 24.0
merged_dft_name: dft_merged.extxyz
